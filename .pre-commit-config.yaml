# Install: pip install pre-commit (or uv tool install pre-commit), then
# `pre-commit install` in the repo root. Skip once with `git commit -n`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: backend/.venv/bin/ruff check
        args: [--fix]
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
        always_run: false
      - id: ruff-format
        name: ruff format (backend)
        entry: backend/.venv/bin/ruff format
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
        always_run: false
      - id: oxlint
        name: oxlint (frontend)
        entry: npx oxlint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^frontend/src/
        pass_filenames: false
        always_run: false
        require_serial: true
        verbose: false
      - id: vitest
        name: vitest (frontend)
        entry: npm test --prefix frontend --
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^frontend/src/
        pass_filenames: false
        always_run: false
        require_serial: true
